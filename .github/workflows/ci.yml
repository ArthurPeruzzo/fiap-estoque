# CI — roda em toda pull request pra main. Valida o serviço (compila, testa, cobertura mínima, empacota,
# build da imagem) e mostra o que o Terraform mudaria (plan, sem aplicar nada). Não publica imagem nem
# faz deploy — isso é o cd.yml, pós-merge.

name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Build da imagem (sem publicar)
      run: docker build -t fiap-estoque:ci .

  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/app-infra
    env:
      TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform fmt
      run: terraform fmt -check -recursive
    - name: Terraform init
      run: terraform init
    - name: Terraform validate
      run: terraform validate
    # Lê o state do fiap-mecanica-infra-k8s (VPC/subnets/SG do cluster): numa conta zerada esse repositório
    # precisa ter sido aplicado antes, senão o plan não encontra a chave de state.
    - name: Terraform plan
      run: terraform plan
