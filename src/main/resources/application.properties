spring.application.name=estoque
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3308/estoque}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mesmo segredo e issuer da API principal (fiap-mecanica): o JWT emitido por ela é aceito aqui.
jwt.secret=${JWT_SECRET}
jwt.issuer=mecanica-fiap

# Token de servico (fiap-mecanica -> estoque), nas rotas internas /reserva/** e /catalogo/**.
# Segredo proprio (Base64URL, >= 32 bytes), diferente do JWT de usuario acima.
servico.jwt.secret=${SERVICE_JWT_SECRET}
servico.jwt.issuer=mecanica-fiap-servicos
servico.jwt.audience=fiap-estoque
servico.jwt.leeway=10s

# URL publica pela qual a API e acessada de fora. Vazio => o springdoc deduz do header Host.
# Mensageria (RabbitMQ): consome os comandos assincronos do fiap-mecanica (liberar reservas de OS cancelada).
# Falha ao processar => retry com espera crescente; esgotadas as tentativas a mensagem vai para a DLQ.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:fiap}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# O consumo vira um span filho do trace que vem no cabecalho traceparent da mensagem (colocado pelo relay da outbox do
# fiap-mecanica): o cancelamento e a liberacao no estoque aparecem no MESMO trace.
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.listener.simple.retry.enabled=true
# max-retries conta as tentativas DEPOIS da primeira (3 => 4 execucoes no total)
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
estoque.mensageria.exchange=estoque.comandos
estoque.mensageria.fila.liberar-reserva=estoque.liberar-reserva
estoque.mensageria.routing-key.liberar-reserva=reserva.liberar
estoque.mensageria.listener.enabled=true

swagger.server-url=${PUBLIC_BASE_URL:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# O broker fora do ar nao pode derrubar a probe: as mensagens ficam na fila e o consumo retoma quando ele voltar.
management.health.rabbit.enabled=false

logging.structured.format.console=ecs

# Observabilidade (mesma da Fase 3 no fiap-mecanica): traces + metricas exportados via OTLP para a New Relic.
# O service.name vem de spring.application.name ("estoque"), entao o servico aparece separado do "mecanica".
# A api-key vem de NEW_RELIC_LICENSE_KEY (env var / k8s Secret), nunca hardcoded. Os logs ECS acima incluem
# trace.id/span.id quando ha trace ativo, correlacionando logs e traces.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://otlp.nr-data.net:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://otlp.nr-data.net:4318/v1/metrics}
management.otlp.metrics.export.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
# A New Relic e um sistema delta: com o default (cumulative) os Timers viram histogramas cumulativos
# re-emitidos a cada step, e average()/count() no NRQL ficam sem sentido.
management.otlp.metrics.export.aggregation-temporality=delta
management.otlp.metrics.export.histogram-flavor=base2-exponential-bucket-histogram
# Step menor => o dado aparece no dashboard em ~30s em vez de ate 1min.
management.otlp.metrics.export.step=30s
