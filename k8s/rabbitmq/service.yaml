# Headless: identidade de rede estavel do pod do StatefulSet (rabbitmq-0).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: mensageria
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
# Endereco usado pelos servicos: rabbitmq.mensageria.svc.cluster.local:5672 (ClusterIP — o broker
# nao e exposto fora do cluster; o painel de gerenciamento tambem nao).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: mensageria
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
