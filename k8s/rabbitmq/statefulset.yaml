apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: mensageria
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # O volume EBS nasce com dono root; o grupo do usuario "rabbitmq" (999) precisa poder escrever nele.
      # OnRootMismatch: o fsGroup so e aplicado (recursivamente) se a raiz do volume nao bater. Com o padrao (Always)
      # o Kubernetes refaz as permissoes de TODO o conteudo a cada montagem e deixa o .erlang.cookie legivel pelo grupo;
      # o Erlang recusa subir ("Cookie file ... must be accessible by owner only"). Resultado: o broker subia na primeira
      # vez e nunca mais depois de recriar o pod (drenagem de no, atualizacao do StatefulSet).
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            failureThreshold: 30
            periodSeconds: 10
            # O CLI do RabbitMQ (uma VM Erlang nova a cada chamada) leva alguns segundos; com o padrão de 1 s a probe
            # sempre estoura e o pod nunca fica Ready, mesmo com o broker já aceitando conexões.
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 5Gi
